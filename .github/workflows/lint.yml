name: Lint

on:
  push:
    branches: [master]
    paths:
      - grammar.js
      - eslint.config.mjs
  pull_request:
    paths:
      - grammar.js
      - eslint.config.mjs

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 22
      - name: Install modules
        run: npm ci --legacy-peer-deps
      - name: Run ESLint
        run: npm run lint
