[package]
authors = [
  "Amaan Qureshi <contact@amaanq.com>",
  "Andrew Hlynskyi <ahlincq@gmail.com>",
]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "KDL grammar for tree-sitter"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "kdl" ]
license = "MIT"
name = "tree-sitter-kdl"
repository = "https://github.com/amaanq/tree-sitter-kdl"
version = "2.0.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.8"

[build-dependencies]
cc = "1.4.5"

[dev-dependencies]
tree-sitter = "0.27.0"
